name: Deploy to VPS

on:
  push:
    branches:
      - main
      - "claude/bootstrap-project-BsFvC"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # printf preserves newlines correctly even if the secret has been re-encoded
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Validate the key parses, fail fast otherwise
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "Public derived from private:"; cat ~/.ssh/id_ed25519.pub
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BRANCH: ${{ github.ref_name }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USER_LOGIN: ${{ secrets.WP_USER_LOGIN }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VPS_IP: ${{ secrets.VPS_IP }}
          EDITOR_AUTH_USERS: ${{ secrets.EDITOR_AUTH_USERS }}
        run: |
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            WP_BASE_URL="$WP_BASE_URL" \
            WP_USER_LOGIN="$WP_USER_LOGIN" \
            WP_APP_PASSWORD="$WP_APP_PASSWORD" \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            VPS_IP="$VPS_IP" \
            EDITOR_AUTH_USERS="$EDITOR_AUTH_USERS" \
            BRANCH="$BRANCH" \
            bash -se <<'EOF'
          set -euo pipefail
          cd /opt/managed-agents
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"
          cd deploy
          # Réécriture du .env depuis les secrets CI pour rester reproductible
          umask 077
          cat > .env <<ENVEOF
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          WP_BASE_URL=$WP_BASE_URL
          WP_USER=$WP_USER_LOGIN
          WP_APP_PASSWORD=$WP_APP_PASSWORD
          GEMINI_API_KEY=$GEMINI_API_KEY
          VPS_IP=$VPS_IP
          EDITOR_AUTH_USERS=$EDITOR_AUTH_USERS
          ENVEOF
          # Heredoc indentation: virer les espaces de tête
          sed -i 's/^[[:space:]]\+//' .env
          docker compose -f docker-compose.local.yml --env-file .env up -d --build
          echo "→ Status:"
          docker compose -f docker-compose.local.yml ps
          EOF

      - name: Smoke test
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # Petit délai pour que les containers redémarrent
          sleep 8
          echo "→ Health check"
          curl -fsS --max-time 30 "https://agent.${VPS_HOST}.nip.io/api/health" | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
