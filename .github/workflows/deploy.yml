name: Deploy to VPS

on:
  push:
    branches:
      - main
      - "claude/bootstrap-project-BsFvC"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # printf preserves newlines correctly even if the secret has been re-encoded
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Validate the key parses, fail fast otherwise
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "Public derived from private:"; cat ~/.ssh/id_ed25519.pub
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BRANCH: ${{ github.ref_name }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USER_LOGIN: ${{ secrets.WP_USER_LOGIN }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VPS_IP: ${{ secrets.VPS_IP }}
          EDITOR_AUTH_USERS: ${{ secrets.EDITOR_AUTH_USERS }}
        run: |
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            WP_BASE_URL="$WP_BASE_URL" \
            WP_USER_LOGIN="$WP_USER_LOGIN" \
            WP_APP_PASSWORD="$WP_APP_PASSWORD" \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            VPS_IP="$VPS_IP" \
            EDITOR_AUTH_USERS="$EDITOR_AUTH_USERS" \
            BRANCH="$BRANCH" \
            bash -se <<'EOF'
          set -euo pipefail
          cd /opt/managed-agents
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"
          cd deploy
          # Réécriture du .env depuis les secrets CI pour rester reproductible.
          # On utilise printf au lieu d'un heredoc pour éviter que le shell
          # remote interprète des séquences spéciales (notamment \$\$ comme PID
          # de bash) dans les valeurs contenant des dollars (bcrypt hash etc).
          umask 077
          : > .env
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" >> .env
          printf 'WP_BASE_URL=%s\n' "$WP_BASE_URL" >> .env
          printf 'WP_USER=%s\n' "$WP_USER_LOGIN" >> .env
          printf 'WP_APP_PASSWORD=%s\n' "$WP_APP_PASSWORD" >> .env
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
          printf 'VPS_IP=%s\n' "$VPS_IP" >> .env
          printf 'EDITOR_AUTH_USERS=%s\n' "$EDITOR_AUTH_USERS" >> .env
          docker compose -f docker-compose.local.yml --env-file .env up -d --build
          echo "→ Status:"
          docker compose -f docker-compose.local.yml ps
          echo "→ Traefik labels (server):"
          docker inspect cms-lab-agent-server-1 --format '{{json .Config.Labels}}' 2>/dev/null | python3 -m json.tool 2>/dev/null | grep -E "middleware|users|router" | head -10 || true
          echo "→ Traefik logs (last 30 lines):"
          docker logs traefik-traefik-1 --tail 30 2>&1 | grep -iE "error|editor-auth|agent-" | tail -20 || true
          EOF

      - name: Smoke test
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          EDITOR_AUTH_USERS: ${{ secrets.EDITOR_AUTH_USERS }}
        run: |
          # Petit délai pour que les containers redémarrent
          sleep 8
          # Récupère user du label htpasswd "user:bcryptHash" pour authentifier
          # le smoke test (l'app est gated par Basic Auth via Traefik).
          AUTH_USER="${EDITOR_AUTH_USERS%%:*}"
          # Note: on n'a pas le password en clair côté CI, on utilise donc le
          # hash uniquement pour vérifier qu'on a bien un user. Le smoke test
          # accepte un 401 (= Traefik répond bien avec auth challenge).
          echo "→ Health check (avec credentials manquants → attend 401)"
          code=$(curl -s -o /tmp/health.body -w "%{http_code}" --max-time 30 "https://agent.${VPS_HOST}.nip.io/api/health")
          echo "HTTP $code"
          cat /tmp/health.body
          if [ "$code" = "401" ]; then
            echo "✓ Auth gating actif (401 attendu sans credentials)"
            exit 0
          fi
          if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.body; then
            echo "⚠ App accessible sans auth — vérifie EDITOR_AUTH_USERS"
            exit 0
          fi
          echo "✗ Health check failed (code=$code)"
          exit 1
